name: Deploy webapp to GitHub Pages

# Builds the self-contained SPA and publishes it to GitHub Pages.  The wasm
# search engine is compiled here (emscripten) rather than committed; net2.onnx
# and the page sources are already in the repo, and onnxruntime-web loads from
# a CDN at runtime (see webapp/app.mjs).

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - 'src/micro_mcts.c'
      - 'src/bb_core.h'
      - 'src/stauf_wasm.cpp'
      - 'thirdparty/scummvm-cell/**'
      - 'LICENSE'
      - 'Makefile'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push cancel an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.4

      # Delegated to `make pages` rather than repeated here: the bundle now
      # includes the GPLv3 Stauf module, and the licence + written offer it
      # requires are emitted by that target.  A second hand-maintained copy list
      # would silently ship the wasm without them.
      - name: Build the wasm engines and assemble public/
        run: make pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
